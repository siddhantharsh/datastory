services:
  datastory:
    image: datastory:latest
    container_name: datastory
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
    volumes:
      - datastory_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: 256m

volumes:
  datastory_data:
