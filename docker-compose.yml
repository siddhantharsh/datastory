services:
  datastory:
    image: datastory:latest
    container_name: datastory
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      # Signs login session cookies. Without an explicit value the server
      # generates a random one at boot, which invalidates every logged-in
      # session on each restart/redeploy — set a real persisted value via a
      # sibling .env file (git-ignored), e.g.:
      #   echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - datastory_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: 256m

volumes:
  datastory_data:
