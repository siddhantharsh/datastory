services:
  datastory:
    image: datastory:latest
    container_name: datastory
    restart: unless-stopped
    environment:
      - PORT=3001
      - DATA_DIR=/app/data
      # Gates Editor mode (upload/delete) — override this for any real
      # deployment rather than relying on the app's own default. Set via a
      # sibling .env file (git-ignored) rather than editing this committed
      # file, e.g.: echo "EDITOR_PASSCODE=some-real-value" > .env
      - EDITOR_PASSCODE=${EDITOR_PASSCODE:-hackathon2026}
    volumes:
      - datastory_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: 256m

volumes:
  datastory_data:
